name: print_shop

services:

  print-service:
    build: ./printshop
    container_name: printshop-print-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PRINTSHOP_SERVER_PORT: 8081
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      PRINTSHOP_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-print_shop}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      PRINTSHOP_DATASOURCE_USERNAME: ${MYSQL_USER:-print_shop}
      PRINTSHOP_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      PRINTSHOP_JWT_SECRET: ${PRINTSHOP_JWT_SECRET:?PRINTSHOP_JWT_SECRET is required}
      PRINTSHOP_FIELD_ENCRYPTION_KEY: ${PRINTSHOP_FIELD_ENCRYPTION_KEY:?PRINTSHOP_FIELD_ENCRYPTION_KEY is required}
      PRINTSHOP_REDIS_HOST: ${PRINTSHOP_REDIS_HOST:-redis}
      PRINTSHOP_REDIS_PORT: ${PRINTSHOP_REDIS_PORT:-6379}
      PRINTSHOP_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      PRINTSHOP_REDIS_DATABASE: ${PRINTSHOP_REDIS_DATABASE:-0}
      PRINTSHOP_CAPTCHA_EXPIRE_SECONDS: ${PRINTSHOP_CAPTCHA_EXPIRE_SECONDS:-120}
      PRINTSHOP_MAIL_ENABLED: ${PRINTSHOP_MAIL_ENABLED:-false}
      PRINTSHOP_MAIL_HOST: ${PRINTSHOP_MAIL_HOST:-smtp.qq.com}
      PRINTSHOP_MAIL_PORT: ${PRINTSHOP_MAIL_PORT:-465}
      PRINTSHOP_MAIL_USERNAME: ${PRINTSHOP_MAIL_USERNAME:-}
      PRINTSHOP_MAIL_AUTH_CODE: ${PRINTSHOP_MAIL_AUTH_CODE:-}
      PRINTSHOP_MAIL_FROM: ${PRINTSHOP_MAIL_FROM:-${PRINTSHOP_MAIL_USERNAME:-}}
      PRINTSHOP_EMAIL_CODE_EXPIRE_SECONDS: ${PRINTSHOP_EMAIL_CODE_EXPIRE_SECONDS:-300}
      PRINTSHOP_EMAIL_CODE_COOLDOWN_SECONDS: ${PRINTSHOP_EMAIL_CODE_COOLDOWN_SECONDS:-60}
      PRINTSHOP_EMAIL_DAILY_LIMIT: ${PRINTSHOP_EMAIL_DAILY_LIMIT:-20}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      BAIDU_OCR_ENDPOINT: ${BAIDU_OCR_ENDPOINT:-https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic}
      BAIDU_OCR_TIMEOUT_MS: ${BAIDU_OCR_TIMEOUT_MS:-60000}
      BAIDU_OCR_MAX_FILE_SIZE_MB: ${BAIDU_OCR_MAX_FILE_SIZE_MB:-4}
      BAIDU_OCR_PDF_FONT_PATH: ${BAIDU_OCR_PDF_FONT_PATH:-}
      PRINTSHOP_REQUIRE_HTTPS: ${PRINTSHOP_REQUIRE_HTTPS:-true}
      PRINTSHOP_ALLOWED_ORIGINS: ${PRINTSHOP_ALLOWED_ORIGINS:-https://www.guangxun.ltd}
      PRINTSHOP_UPLOAD_DIR: /data/files
      PRINTSHOP_MAX_FILE_SIZE: ${PRINTSHOP_MAX_FILE_SIZE:-20MB}
      PRINTSHOP_MAX_REQUEST_SIZE: ${PRINTSHOP_MAX_REQUEST_SIZE:-20MB}
      PRINTSHOP_OPENXML_MAX_ENTRIES: ${PRINTSHOP_OPENXML_MAX_ENTRIES:-2000}
      PRINTSHOP_OPENXML_MAX_ENTRY_UNCOMPRESSED_BYTES: ${PRINTSHOP_OPENXML_MAX_ENTRY_UNCOMPRESSED_BYTES:-20971520}
      PRINTSHOP_OPENXML_MAX_TOTAL_UNCOMPRESSED_BYTES: ${PRINTSHOP_OPENXML_MAX_TOTAL_UNCOMPRESSED_BYTES:-104857600}
      PRINTSHOP_PDF_MAX_PAGES: ${PRINTSHOP_PDF_MAX_PAGES:-200}
      PRINTSHOP_PDF_REJECT_ENCRYPTED: ${PRINTSHOP_PDF_REJECT_ENCRYPTED:-true}
      PRINTSHOP_PDF_MAX_OBJECTS: ${PRINTSHOP_PDF_MAX_OBJECTS:-10000}
      PRINTSHOP_PDF_MAX_PAGE_CONTENT_STREAMS: ${PRINTSHOP_PDF_MAX_PAGE_CONTENT_STREAMS:-64}
      PRINTSHOP_PDF_MAX_PAGE_CONTENT_BYTES: ${PRINTSHOP_PDF_MAX_PAGE_CONTENT_BYTES:-2097152}
      PRINTSHOP_PDF_MAX_TOTAL_CONTENT_BYTES: ${PRINTSHOP_PDF_MAX_TOTAL_CONTENT_BYTES:-20971520}
      PRINTSHOP_IMAGE_MAX_WIDTH: ${PRINTSHOP_IMAGE_MAX_WIDTH:-10000}
      PRINTSHOP_IMAGE_MAX_HEIGHT: ${PRINTSHOP_IMAGE_MAX_HEIGHT:-10000}
      PRINTSHOP_IMAGE_MAX_PIXELS: ${PRINTSHOP_IMAGE_MAX_PIXELS:-40000000}
      PRINTSHOP_IMAGE_MODERATION_ENABLED: ${PRINTSHOP_IMAGE_MODERATION_ENABLED:-false}
      PRINTSHOP_IMAGE_MODERATION_ENDPOINT_URL: ${PRINTSHOP_IMAGE_MODERATION_ENDPOINT_URL:-}
      PRINTSHOP_IMAGE_MODERATION_API_KEY: ${PRINTSHOP_IMAGE_MODERATION_API_KEY:-}
      PRINTSHOP_IMAGE_MODERATION_TIMEOUT_MS: ${PRINTSHOP_IMAGE_MODERATION_TIMEOUT_MS:-5000}
      PRINTSHOP_IMAGE_MODERATION_FAIL_CLOSED: ${PRINTSHOP_IMAGE_MODERATION_FAIL_CLOSED:-true}
      PRINTSHOP_LOGIN_MAX_FAILURES: ${PRINTSHOP_LOGIN_MAX_FAILURES:-5}
      PRINTSHOP_LOGIN_LOCK_SECONDS: ${PRINTSHOP_LOGIN_LOCK_SECONDS:-900}
      PRINTSHOP_LOGIN_WINDOW_SECONDS: ${PRINTSHOP_LOGIN_WINDOW_SECONDS:-900}
      PRINTSHOP_TRUST_FORWARDED_HEADERS: ${PRINTSHOP_TRUST_FORWARDED_HEADERS:-false}
      PRINTSHOP_SECURITY_ALERT_ENABLED: ${PRINTSHOP_SECURITY_ALERT_ENABLED:-true}
      PRINTSHOP_SECURITY_ALERT_WEBHOOK_URL: ${PRINTSHOP_SECURITY_ALERT_WEBHOOK_URL:-}
      PRINTSHOP_RATE_LIMIT_ENABLED: ${PRINTSHOP_RATE_LIMIT_ENABLED:-true}
      PRINTSHOP_RATE_LIMIT_REQUESTS: ${PRINTSHOP_RATE_LIMIT_REQUESTS:-240}
      PRINTSHOP_RATE_LIMIT_WINDOW_SECONDS: ${PRINTSHOP_RATE_LIMIT_WINDOW_SECONDS:-60}
      PRINTSHOP_BOOTSTRAP_ADMIN_ENABLED: ${PRINTSHOP_BOOTSTRAP_ADMIN_ENABLED:-false}
      PRINTSHOP_BOOTSTRAP_ADMIN_USERNAME: ${PRINTSHOP_BOOTSTRAP_ADMIN_USERNAME:-}
      PRINTSHOP_BOOTSTRAP_ADMIN_PASSWORD: ${PRINTSHOP_BOOTSTRAP_ADMIN_PASSWORD:-}
      PRINTSHOP_BOOTSTRAP_ADMIN_REAL_NAME: ${PRINTSHOP_BOOTSTRAP_ADMIN_REAL_NAME:-}
      PRINTSHOP_BOOTSTRAP_ADMIN_PHONE: ${PRINTSHOP_BOOTSTRAP_ADMIN_PHONE:-}
      PRINTSHOP_BOOTSTRAP_ADMIN_EMAIL: ${PRINTSHOP_BOOTSTRAP_ADMIN_EMAIL:-}
      PRINTSHOP_VIRUS_SCAN_ENABLED: ${PRINTSHOP_VIRUS_SCAN_ENABLED:-true}
      PRINTSHOP_VIRUS_SCAN_HOST: ${PRINTSHOP_VIRUS_SCAN_HOST:-clamav}
      PRINTSHOP_VIRUS_SCAN_PORT: ${PRINTSHOP_VIRUS_SCAN_PORT:-3310}
      PRINTSHOP_VIRUS_SCAN_TIMEOUT_MS: ${PRINTSHOP_VIRUS_SCAN_TIMEOUT_MS:-5000}
      PRINTSHOP_VIRUS_SCAN_FAIL_CLOSED: ${PRINTSHOP_VIRUS_SCAN_FAIL_CLOSED:-true}
      PRINTSHOP_PHOTO_BASE_URL: ${PRINTSHOP_PHOTO_BASE_URL:-http://photo-service:8091}
      PRINTSHOP_IMAGEGEN_STORAGE_DIR: ${PRINTSHOP_IMAGEGEN_STORAGE_DIR:-}
      PRINTSHOP_IMAGEGEN_PROMPT_BLOCKLIST: ${PRINTSHOP_IMAGEGEN_PROMPT_BLOCKLIST:-}
      PRINTSHOP_DEEPSEEK_API_KEY: ${PRINTSHOP_DEEPSEEK_API_KEY:-}
      PRINTSHOP_DEEPSEEK_BASE_URL: ${PRINTSHOP_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      PRINTSHOP_DEEPSEEK_MODEL: ${PRINTSHOP_DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./data/files:/data/files
    expose:
      - "8081"
    restart: unless-stopped

  schedule-service:
    build: ./schedule-service
    container_name: printshop-schedule-service
    environment:
      SCHEDULE_SERVER_PORT: 8092
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      SCHEDULE_DATASOURCE_URL: ${SCHEDULE_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${SCHEDULE_DATABASE:-schedule_db}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
      SCHEDULE_DATASOURCE_USERNAME: ${SCHEDULE_DATASOURCE_USERNAME:-${MYSQL_USER:-print_shop}}
      SCHEDULE_DATASOURCE_PASSWORD: ${SCHEDULE_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}}
      SCHEDULE_FIELD_ENCRYPTION_KEY: ${SCHEDULE_FIELD_ENCRYPTION_KEY:-${PRINTSHOP_FIELD_ENCRYPTION_KEY:?PRINTSHOP_FIELD_ENCRYPTION_KEY is required}}
      SCHEDULE_AUTH_ENABLED: ${SCHEDULE_AUTH_ENABLED:-true}
      SCHEDULE_JWT_SECRET: ${SCHEDULE_JWT_SECRET:-${PRINTSHOP_JWT_SECRET:?PRINTSHOP_JWT_SECRET is required}}
      SCHEDULE_SYNC_MOCK_ENABLED: ${SCHEDULE_SYNC_MOCK_ENABLED:-false}
      SCHEDULE_SYNC_ZFSOFT_ENABLED: ${SCHEDULE_SYNC_ZFSOFT_ENABLED:-false}
      SCHEDULE_SYNC_ZFSOFT_BASE_URL: ${SCHEDULE_SYNC_ZFSOFT_BASE_URL:-}
      SCHEDULE_SYNC_ZFSOFT_GNMKDM: ${SCHEDULE_SYNC_ZFSOFT_GNMKDM:-N253508}
      SCHEDULE_SYNC_ZFSOFT_TIMEOUT_MS: ${SCHEDULE_SYNC_ZFSOFT_TIMEOUT_MS:-15000}
      SCHEDULE_SYNC_HTTP_ENABLED: ${SCHEDULE_SYNC_HTTP_ENABLED:-false}
      SCHEDULE_SYNC_HTTP_ENDPOINT_URL: ${SCHEDULE_SYNC_HTTP_ENDPOINT_URL:-}
      SCHEDULE_SYNC_HTTP_BEARER_TOKEN: ${SCHEDULE_SYNC_HTTP_BEARER_TOKEN:-}
      SCHEDULE_SYNC_HTTP_TIMEOUT_MS: ${SCHEDULE_SYNC_HTTP_TIMEOUT_MS:-10000}
      SCHEDULE_ACTUATOR_EXPOSURE: ${SCHEDULE_ACTUATOR_EXPOSURE:-health,info}
    expose:
      - "8092"
    restart: unless-stopped

  photo-service:
    build: ./photo-service
    environment:
      PHOTO_PORT: 8091
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      PHOTO_MAX_UPLOAD_BYTES: ${PHOTO_MAX_UPLOAD_BYTES:-8388608}
      PHOTO_MAX_IMAGE_WIDTH: ${PHOTO_MAX_IMAGE_WIDTH:-8000}
      PHOTO_MAX_IMAGE_HEIGHT: ${PHOTO_MAX_IMAGE_HEIGHT:-8000}
      PHOTO_MAX_IMAGE_PIXELS: ${PHOTO_MAX_IMAGE_PIXELS:-24000000}
      MODEL_PATH: ${PHOTO_MODEL_PATH:-pretrained/modnet.onnx}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-https://tokenhub.tencentmaas.com/v1}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_API_TIMEOUT_SECONDS: ${IMAGE_API_TIMEOUT_SECONDS:-60}
      IMAGE_MODEL: ${IMAGE_MODEL:-seedream-image-v5.0-lite}
    expose:
      - "8091"
    restart: unless-stopped

  chat-service:
    build: ./chat-service
    container_name: printshop-chat-service
    environment:
      CHAT_PORT: 8093
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-print_shop}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${CHAT_DATABASE:-chatbot_db}?charset=utf8mb4}
      CHAT_AUTH_ENABLED: ${CHAT_AUTH_ENABLED:-true}
      CHAT_JWT_SECRET: ${CHAT_JWT_SECRET:-${PRINTSHOP_JWT_SECRET:?PRINTSHOP_JWT_SECRET is required}}
      CHAT_SEED_DEFAULTS: ${CHAT_SEED_DEFAULTS:-true}
      CHAT_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2"
      CHAT_QDRANT_URL: ${CHAT_QDRANT_URL:-http://qdrant:6333}
      CHAT_QDRANT_COLLECTION: ${CHAT_QDRANT_COLLECTION:-printshop_knowledge}
      CHAT_VECTOR_ENABLED: ${CHAT_VECTOR_ENABLED:-true}
      CHAT_VECTOR_REQUIRED: ${CHAT_VECTOR_REQUIRED:-true}
      CHAT_EMBEDDING_MODEL: ${CHAT_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      CHAT_EMBEDDING_CACHE_DIR: /models/fastembed
      CHAT_DOCUMENT_DIR: /data/chat-documents
      CHAT_MAX_MARKDOWN_BYTES: ${CHAT_MAX_MARKDOWN_BYTES:-5242880}
      CHAT_CHUNK_SIZE: ${CHAT_CHUNK_SIZE:-900}
      CHAT_CHUNK_OVERLAP: ${CHAT_CHUNK_OVERLAP:-120}
      CHAT_INGESTION_INLINE: ${CHAT_INGESTION_INLINE:-false}
      CHAT_INTERNAL_GATEWAY_URL: ${CHAT_INTERNAL_GATEWAY_URL:-http://gateway:8080}
      CHAT_TOOL_TIMEOUT_SECONDS: ${CHAT_TOOL_TIMEOUT_SECONDS:-8}
      CHAT_AGENT_MAX_STEPS: ${CHAT_AGENT_MAX_STEPS:-4}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-12}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-25}
    volumes:
      - ./data/chat-documents:/data/chat-documents
      - ./data/models/fastembed:/models/fastembed
    expose:
      - "8093"
    restart: unless-stopped

  chat-worker:
    build: ./chat-service
    container_name: printshop-chat-worker
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-print_shop}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${CHAT_DATABASE:-chatbot_db}?charset=utf8mb4}
      CHAT_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2"
      CHAT_QDRANT_URL: ${CHAT_QDRANT_URL:-http://qdrant:6333}
      CHAT_QDRANT_COLLECTION: ${CHAT_QDRANT_COLLECTION:-printshop_knowledge}
      CHAT_VECTOR_ENABLED: ${CHAT_VECTOR_ENABLED:-true}
      CHAT_VECTOR_REQUIRED: ${CHAT_VECTOR_REQUIRED:-true}
      CHAT_EMBEDDING_MODEL: ${CHAT_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      CHAT_EMBEDDING_CACHE_DIR: /models/fastembed
      CHAT_DOCUMENT_DIR: /data/chat-documents
      CHAT_CHUNK_SIZE: ${CHAT_CHUNK_SIZE:-900}
      CHAT_CHUNK_OVERLAP: ${CHAT_CHUNK_OVERLAP:-120}
    volumes:
      - ./data/chat-documents:/data/chat-documents
      - ./data/models/fastembed:/models/fastembed
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: printshop-gateway
    environment:
      GATEWAY_PORT: 8080
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      PRINT_SERVICE_URI: lb://print-service
      PHOTO_SERVICE_URI: ${PHOTO_SERVICE_URI:-lb://photo-service}
      SCHEDULE_SERVICE_URI: ${SCHEDULE_SERVICE_URI:-lb://schedule-service}
      CHAT_SERVICE_URI: ${CHAT_SERVICE_URI:-lb://chat-service}
      GATEWAY_ACTUATOR_EXPOSURE: ${GATEWAY_ACTUATOR_EXPOSURE:-health,info}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-https://www.guangxun.ltd}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-${PRINTSHOP_JWT_SECRET:?PRINTSHOP_JWT_SECRET is required}}
      GATEWAY_PRINT_COMPAT_PATHS: ${GATEWAY_PRINT_COMPAT_PATHS:-/api/**}
      GATEWAY_TRUST_FORWARDED_HEADERS: ${GATEWAY_TRUST_FORWARDED_HEADERS:-false}
      GATEWAY_REQUEST_LOG_ENABLED: ${GATEWAY_REQUEST_LOG_ENABLED:-true}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-600}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_CB_SLIDING_WINDOW_SIZE: ${GATEWAY_CB_SLIDING_WINDOW_SIZE:-20}
      GATEWAY_CB_MINIMUM_CALLS: ${GATEWAY_CB_MINIMUM_CALLS:-10}
      GATEWAY_CB_FAILURE_RATE_THRESHOLD: ${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-50}
      GATEWAY_CB_WAIT_DURATION: ${GATEWAY_CB_WAIT_DURATION:-30s}
      GATEWAY_CB_HALF_OPEN_CALLS: ${GATEWAY_CB_HALF_OPEN_CALLS:-3}
      GATEWAY_CB_TIMEOUT: ${GATEWAY_CB_TIMEOUT:-10s}
      GATEWAY_PRINT_CB_SLIDING_WINDOW_SIZE: "${GATEWAY_PRINT_CB_SLIDING_WINDOW_SIZE:-${GATEWAY_CB_SLIDING_WINDOW_SIZE:-20}}"
      GATEWAY_PRINT_CB_MINIMUM_CALLS: "${GATEWAY_PRINT_CB_MINIMUM_CALLS:-${GATEWAY_CB_MINIMUM_CALLS:-10}}"
      GATEWAY_PRINT_CB_FAILURE_RATE_THRESHOLD: "${GATEWAY_PRINT_CB_FAILURE_RATE_THRESHOLD:-${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-50}}"
      GATEWAY_PRINT_CB_WAIT_DURATION: "${GATEWAY_PRINT_CB_WAIT_DURATION:-${GATEWAY_CB_WAIT_DURATION:-30s}}"
      GATEWAY_PRINT_CB_HALF_OPEN_CALLS: "${GATEWAY_PRINT_CB_HALF_OPEN_CALLS:-${GATEWAY_CB_HALF_OPEN_CALLS:-3}}"
      GATEWAY_PRINT_CB_TIMEOUT: "${GATEWAY_PRINT_CB_TIMEOUT:-90s}"
      GATEWAY_PHOTO_CB_SLIDING_WINDOW_SIZE: "${GATEWAY_PHOTO_CB_SLIDING_WINDOW_SIZE:-${GATEWAY_CB_SLIDING_WINDOW_SIZE:-20}}"
      GATEWAY_PHOTO_CB_MINIMUM_CALLS: "${GATEWAY_PHOTO_CB_MINIMUM_CALLS:-${GATEWAY_CB_MINIMUM_CALLS:-10}}"
      GATEWAY_PHOTO_CB_FAILURE_RATE_THRESHOLD: "${GATEWAY_PHOTO_CB_FAILURE_RATE_THRESHOLD:-${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-50}}"
      GATEWAY_PHOTO_CB_WAIT_DURATION: "${GATEWAY_PHOTO_CB_WAIT_DURATION:-${GATEWAY_CB_WAIT_DURATION:-30s}}"
      GATEWAY_PHOTO_CB_HALF_OPEN_CALLS: "${GATEWAY_PHOTO_CB_HALF_OPEN_CALLS:-${GATEWAY_CB_HALF_OPEN_CALLS:-3}}"
      GATEWAY_PHOTO_CB_TIMEOUT: "${GATEWAY_PHOTO_CB_TIMEOUT:-90s}"
      GATEWAY_SCHEDULE_CB_SLIDING_WINDOW_SIZE: "${GATEWAY_SCHEDULE_CB_SLIDING_WINDOW_SIZE:-${GATEWAY_CB_SLIDING_WINDOW_SIZE:-20}}"
      GATEWAY_SCHEDULE_CB_MINIMUM_CALLS: "${GATEWAY_SCHEDULE_CB_MINIMUM_CALLS:-${GATEWAY_CB_MINIMUM_CALLS:-10}}"
      GATEWAY_SCHEDULE_CB_FAILURE_RATE_THRESHOLD: "${GATEWAY_SCHEDULE_CB_FAILURE_RATE_THRESHOLD:-${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-50}}"
      GATEWAY_SCHEDULE_CB_WAIT_DURATION: "${GATEWAY_SCHEDULE_CB_WAIT_DURATION:-${GATEWAY_CB_WAIT_DURATION:-30s}}"
      GATEWAY_SCHEDULE_CB_HALF_OPEN_CALLS: "${GATEWAY_SCHEDULE_CB_HALF_OPEN_CALLS:-${GATEWAY_CB_HALF_OPEN_CALLS:-3}}"
      GATEWAY_SCHEDULE_CB_TIMEOUT: "${GATEWAY_SCHEDULE_CB_TIMEOUT:-${GATEWAY_CB_TIMEOUT:-10s}}"
      GATEWAY_CHAT_CB_SLIDING_WINDOW_SIZE: "${GATEWAY_CHAT_CB_SLIDING_WINDOW_SIZE:-${GATEWAY_CB_SLIDING_WINDOW_SIZE:-20}}"
      GATEWAY_CHAT_CB_MINIMUM_CALLS: "${GATEWAY_CHAT_CB_MINIMUM_CALLS:-${GATEWAY_CB_MINIMUM_CALLS:-10}}"
      GATEWAY_CHAT_CB_FAILURE_RATE_THRESHOLD: "${GATEWAY_CHAT_CB_FAILURE_RATE_THRESHOLD:-${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-50}}"
      GATEWAY_CHAT_CB_WAIT_DURATION: "${GATEWAY_CHAT_CB_WAIT_DURATION:-${GATEWAY_CB_WAIT_DURATION:-30s}}"
      GATEWAY_CHAT_CB_HALF_OPEN_CALLS: "${GATEWAY_CHAT_CB_HALF_OPEN_CALLS:-${GATEWAY_CB_HALF_OPEN_CALLS:-3}}"
      GATEWAY_CHAT_CB_TIMEOUT: "${GATEWAY_CHAT_CB_TIMEOUT:-90s}"
    expose:
      - "8080"
    depends_on:
      - print-service
      - photo-service
      - schedule-service
      - chat-service
    restart: unless-stopped

networks:
  default:
    name: print_shop
    external: true

