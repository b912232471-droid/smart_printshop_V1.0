spring:
  application:
    name: print-service
  profiles:
    # Local/IDE runs default to dev; production compose overrides via SPRING_PROFILES_ACTIVE=prod
    active: dev
  config:
    import: "optional:file:../.env.local[.properties],optional:file:../.env.middleware.local[.properties]"
  datasource:
    # Single MySQL datasource for all profiles; credentials come from environment only
    url: "${PRINTSHOP_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/print_shop?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=UTF-8}"
    username: ${PRINTSHOP_DATASOURCE_USERNAME:print_shop}
    password: ${PRINTSHOP_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Stores short-lived, one-time login captcha answers
      host: ${PRINTSHOP_REDIS_HOST:127.0.0.1}
      port: ${PRINTSHOP_REDIS_PORT:6379}
      password: ${PRINTSHOP_REDIS_PASSWORD:}
      database: ${PRINTSHOP_REDIS_DATABASE:0}
      connect-timeout: ${PRINTSHOP_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${PRINTSHOP_REDIS_TIMEOUT:2s}
  mail:
    # Free QQ Mail SMTP. Use the SMTP authorization code, never the QQ account password.
    host: ${PRINTSHOP_MAIL_HOST:smtp.qq.com}
    port: ${PRINTSHOP_MAIL_PORT:465}
    username: ${PRINTSHOP_MAIL_USERNAME:}
    password: ${PRINTSHOP_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          connectiontimeout: ${PRINTSHOP_MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${PRINTSHOP_MAIL_TIMEOUT_MS:8000}
          writetimeout: ${PRINTSHOP_MAIL_TIMEOUT_MS:8000}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${PRINTSHOP_MAX_FILE_SIZE:20MB}
      max-request-size: ${PRINTSHOP_MAX_REQUEST_SIZE:20MB}
  cloud:
    nacos:
      # Service discovery: off by default locally; docker-compose enables it via NACOS_ENABLED=true
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: ${PRINTSHOP_SERVICE_VERSION:1.0.0}

server:
  port: ${PRINTSHOP_SERVER_PORT:8081}
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.printshop.entity

printshop:
  jwt:
    # Must be injected via environment; the service refuses to start on a missing or weak secret
    secret: ${PRINTSHOP_JWT_SECRET:}
    admin-expire-seconds: ${PRINTSHOP_JWT_ADMIN_EXPIRE_SECONDS:7200}
    user-expire-seconds: ${PRINTSHOP_JWT_USER_EXPIRE_SECONDS:604800}
  crypto:
    field-key: ${PRINTSHOP_FIELD_ENCRYPTION_KEY:}
  mail:
    enabled: ${PRINTSHOP_MAIL_ENABLED:false}
    from: "${PRINTSHOP_MAIL_FROM:${PRINTSHOP_MAIL_USERNAME:}}"
    verification:
      expire-seconds: ${PRINTSHOP_EMAIL_CODE_EXPIRE_SECONDS:300}
      cooldown-seconds: ${PRINTSHOP_EMAIL_CODE_COOLDOWN_SECONDS:60}
      daily-limit: ${PRINTSHOP_EMAIL_DAILY_LIMIT:20}
  security:
    trust-forwarded-headers: ${PRINTSHOP_TRUST_FORWARDED_HEADERS:false}
    login:
      max-failures: ${PRINTSHOP_LOGIN_MAX_FAILURES:5}
      lock-seconds: ${PRINTSHOP_LOGIN_LOCK_SECONDS:900}
      window-seconds: ${PRINTSHOP_LOGIN_WINDOW_SECONDS:900}
    captcha:
      expire-seconds: ${PRINTSHOP_CAPTCHA_EXPIRE_SECONDS:120}
    alert:
      enabled: ${PRINTSHOP_SECURITY_ALERT_ENABLED:true}
      webhook-url: ${PRINTSHOP_SECURITY_ALERT_WEBHOOK_URL:}
    rate-limit:
      enabled: ${PRINTSHOP_RATE_LIMIT_ENABLED:true}
      requests: ${PRINTSHOP_RATE_LIMIT_REQUESTS:240}
      window-seconds: ${PRINTSHOP_RATE_LIMIT_WINDOW_SECONDS:60}
    virus-scan:
      enabled: ${PRINTSHOP_VIRUS_SCAN_ENABLED:false}
      host: ${PRINTSHOP_VIRUS_SCAN_HOST:127.0.0.1}
      port: ${PRINTSHOP_VIRUS_SCAN_PORT:3310}
      timeout-ms: ${PRINTSHOP_VIRUS_SCAN_TIMEOUT_MS:5000}
      fail-closed: ${PRINTSHOP_VIRUS_SCAN_FAIL_CLOSED:true}
    image-moderation:
      enabled: ${PRINTSHOP_IMAGE_MODERATION_ENABLED:false}
      endpoint-url: ${PRINTSHOP_IMAGE_MODERATION_ENDPOINT_URL:}
      api-key: ${PRINTSHOP_IMAGE_MODERATION_API_KEY:}
      timeout-ms: ${PRINTSHOP_IMAGE_MODERATION_TIMEOUT_MS:5000}
      fail-closed: ${PRINTSHOP_IMAGE_MODERATION_FAIL_CLOSED:true}
  file:
    upload-dir: ${PRINTSHOP_UPLOAD_DIR:}
    openxml:
      max-entries: ${PRINTSHOP_OPENXML_MAX_ENTRIES:2000}
      max-entry-uncompressed-bytes: ${PRINTSHOP_OPENXML_MAX_ENTRY_UNCOMPRESSED_BYTES:20971520}
      max-total-uncompressed-bytes: ${PRINTSHOP_OPENXML_MAX_TOTAL_UNCOMPRESSED_BYTES:104857600}
    pdf:
      max-pages: ${PRINTSHOP_PDF_MAX_PAGES:200}
      reject-encrypted: ${PRINTSHOP_PDF_REJECT_ENCRYPTED:true}
      max-objects: ${PRINTSHOP_PDF_MAX_OBJECTS:10000}
      max-page-content-streams: ${PRINTSHOP_PDF_MAX_PAGE_CONTENT_STREAMS:64}
      max-page-content-bytes: ${PRINTSHOP_PDF_MAX_PAGE_CONTENT_BYTES:2097152}
      max-total-content-bytes: ${PRINTSHOP_PDF_MAX_TOTAL_CONTENT_BYTES:20971520}
    image:
      max-width: ${PRINTSHOP_IMAGE_MAX_WIDTH:10000}
      max-height: ${PRINTSHOP_IMAGE_MAX_HEIGHT:10000}
      max-pixels: ${PRINTSHOP_IMAGE_MAX_PIXELS:40000000}
  bootstrap:
    # First-admin bootstrap: off by default; enable only for a brand-new production database
    admin:
      enabled: ${PRINTSHOP_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${PRINTSHOP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${PRINTSHOP_BOOTSTRAP_ADMIN_PASSWORD:}
      real-name: ${PRINTSHOP_BOOTSTRAP_ADMIN_REAL_NAME:}
      phone: ${PRINTSHOP_BOOTSTRAP_ADMIN_PHONE:}
      email: ${PRINTSHOP_BOOTSTRAP_ADMIN_EMAIL:}
  imagegen:
    # AI 图片生成编排（业务在 print-service，photo-service 只做模型适配，见 docs/图文生成功能更新迭代方案-2026-09-06.md）
    photo-base-url: ${PRINTSHOP_PHOTO_BASE_URL:http://photo-service:8091}
    # 生成图存储目录；留空时跟随 printshop.file.upload-dir 解析链路并追加 /imagegen
    storage-dir: ${PRINTSHOP_IMAGEGEN_STORAGE_DIR:}
    # 逗号分隔的提示词黑名单，命中即拒绝（合规红线：去水印/换脸类关键词等）
    prompt-blocklist: ${PRINTSHOP_IMAGEGEN_PROMPT_BLOCKLIST:}
  llm:
    # 仅用于绘图提示词润色（通用 OpenAI 兼容 chat 接口，当前指向 TokenHub 聚合平台 hy3）
    # key/URL/模型逐级回落到 AI 客服的 CHAT_LLM_*，无需单独配置；旧 PRINTSHOP_DEEPSEEK_*/DEEPSEEK_* 变量名保留回退
    api-key: ${PRINTSHOP_LLM_API_KEY:${PRINTSHOP_DEEPSEEK_API_KEY:${LOCAL_DEEPSEEK_API_KEY:}}}
    base-url: ${PRINTSHOP_LLM_BASE_URL:${PRINTSHOP_DEEPSEEK_BASE_URL:${CHAT_LLM_BASE_URL:https://tokenhub.tencentmaas.com/v1}}}
    model: ${PRINTSHOP_LLM_MODEL:${PRINTSHOP_DEEPSEEK_MODEL:${CHAT_LLM_MODEL:hy3}}}
    temperature: ${PRINTSHOP_LLM_TEMPERATURE:0.7}
    max-tokens: ${PRINTSHOP_LLM_MAX_TOKENS:2000}

baidu:
  ocr:
    # AK/SK via environment only; OCR endpoints stay unavailable when unset
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    oauth-url: ${BAIDU_OCR_OAUTH_URL:https://aip.baidubce.com/oauth/2.0/token}
    endpoint: ${BAIDU_OCR_ENDPOINT:https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic}
    timeout-ms: ${BAIDU_OCR_TIMEOUT_MS:60000}
    max-file-size-mb: ${BAIDU_OCR_MAX_FILE_SIZE_MB:4}
    pdf-font-path: ${BAIDU_OCR_PDF_FONT_PATH:}
